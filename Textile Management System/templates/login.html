<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Textile Management System</title>

    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <div class="logo">
            Textile Management
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>


    <!-- Login Section -->
    <section class="login-section">

        <div class="login-box">

            <h1>Admin Login</h1>

            <p>Login to manage the textile system</p>

            <form action="php/login.php" method="POST">

                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                >


                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </section>


    <!-- Footer -->
    <footer>
        <p>
            © 2026 Textile Management System. All Rights Reserved.
        </p>
    </footer>

</body>
</html>
